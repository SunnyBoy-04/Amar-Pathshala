<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>AMAR PATHSHALA | Government Exam Preparation Platform</title>
    <meta name="description" content="AMAR PATHSHALA - Comprehensive online portal for government competitive exams: WBPSC, SSC CGL, Railways, ANM GNM Nursing. Mock test engine, live timer, instant scorecard, and PDF resource library." />
    <!-- Google Fonts Inter & Hind Siliguri (Bengali Support) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Bengali:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans min-h-screen selection:bg-blue-600 selection:text-white">
    <div id="root">
      <div style="min-height: 100vh; background-color: #020617; display: flex; align-items: center; justify-content: center; color: white; font-family: system-ui, -apple-system, sans-serif;">
        <div style="text-align: center;">
          <div style="width: 50px; height: 50px; border: 4px solid rgba(59, 130, 246, 0.2); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px auto;"></div>
          <h2 style="font-weight: 800; font-size: 1.25rem; margin: 0 0 4px 0; color: #ffffff;">AMAR PATHSHALA</h2>
          <p style="color: #94a3b8; font-size: 0.85rem; margin: 0;">Loading Portal...</p>
        </div>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
